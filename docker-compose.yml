# Cashiery POS — full stack via Docker Compose.
#   docker compose up --build
# Frontend: http://localhost:3000  |  Backend API: http://localhost:5001
# (5001 on the host because macOS AirPlay Receiver already owns :5000)
#
# Credentials below are DEV-ONLY defaults, overridable via shell env or a
# .env file at the repo root (docker compose reads it automatically):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, JWT_SECRET

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cashiery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cashiery-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-cashiery}
    volumes:
      - db_data:/var/lib/postgresql/data
    # No initdb.d mount: the schema is managed by node-pg-migrate and applied
    # by the backend container on every startup (see backend/docker-entrypoint.sh
    # and backend/migrations/). To reset the DB entirely:
    #   docker compose down -v && docker compose up --build
    # DB is not published to the host on purpose (avoids clashing with a
    # local PostgreSQL on port 5432). Uncomment if you need host access:
    # ports:
    #   - "5432:5432"

  backend:
    build: ./backend
    init: true # tini reaps zombies and forwards SIGTERM to node for graceful shutdown
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: ${POSTGRES_USER:-cashiery}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cashiery-dev-password}
      DB_NAME: ${POSTGRES_DB:-cashiery}
      # REQUIRED by index.js. DEV-ONLY fallback — set a real secret via
      # `JWT_SECRET=... docker compose up` or a root .env file.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      # Set SEED_PRODUCTS=0 to keep a fresh database empty (skips the
      # first-run demo catalog in scripts/seed.js).
      SEED_PRODUCTS: ${SEED_PRODUCTS:-true}
    ports:
      - "${BACKEND_PORT:-5001}:5000"  # host :5000 is AirPlay Receiver on macOS
    depends_on:
      - db  # backend/docker-entrypoint.sh waits for postgres, runs
        # `node scripts/migrate.js up`, then starts the server

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
