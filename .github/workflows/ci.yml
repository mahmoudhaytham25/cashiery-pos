name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run tests
        working-directory: backend
        run: npx jest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npx vitest run

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cashiery
          POSTGRES_PASSWORD: cashiery-dev-password
          POSTGRES_DB: cashiery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashiery -d cashiery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Same DB_* vars database/db.js reads; scripts/migrate.js maps them
      # to the DATABASE_URL node-pg-migrate expects.
      DB_HOST: localhost
      DB_USER: cashiery
      DB_PASSWORD: cashiery-dev-password
      DB_NAME: cashiery
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Smoke test migrations (up -> down -> up)
        working-directory: backend
        run: |
          npm run migrate:up
          npm run migrate:down
          npm run migrate:up

  frontend-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cashiery
          POSTGRES_PASSWORD: cashiery-dev-password
          POSTGRES_DB: cashiery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashiery -d cashiery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Same DB_* vars database/db.js reads; scripts/migrate.js maps them
      # to the DATABASE_URL node-pg-migrate expects. JWT_SECRET is required
      # by backend/index.js.
      DB_HOST: localhost
      DB_USER: cashiery
      DB_PASSWORD: cashiery-dev-password
      DB_NAME: cashiery
      JWT_SECRET: e2e-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Apply migrations
        working-directory: backend
        run: npm run migrate:up
      - name: Start backend
        working-directory: backend
        run: node index.js &
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:5000/api/products && break; sleep 1; done
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Get Playwright version
        id: playwright-version
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Browsers (~150MB) are cached per @playwright/test version — a hit
      # skips the download; install-deps still runs since system libs
      # aren't cacheable (it's a fast no-op when they're present).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright system dependencies
        working-directory: frontend
        run: npx playwright install-deps chromium
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install chromium
      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

  # Path-filtered deploy trigger: diffs the push range, then hands off to
  # CodeBuild, which clones the repo, builds+pushes each changed service
  # image, and redeploys the EC2 box via SSM (all inside the buildspec).
  # Auth is OIDC — the role (AWS_DEPLOY_ROLE_ARN secret) is created by
  # Terraform and only assumable from this repo's main branch.
  deploy:
    if: github.event_name == 'push'
    needs: [backend-tests, frontend-build, frontend-tests, migrations, frontend-e2e]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # need HEAD + the push's base commit for the diff

      - name: Detect changed service directories
        id: changes
        run: |
          before="${{ github.event.before }}"
          # All-zero 'before' (first push to a branch) or missing object —
          # deploy everything.
          if [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "services=backend frontend" >> "$GITHUB_OUTPUT"
          else
            svcs=$(git diff --name-only "$before" "$GITHUB_SHA" \
              | cut -d/ -f1 | grep -E '^(backend|frontend)$' | sort -u | tr '\n' ' ' || true)
            echo "services=$svcs" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.changes.outputs.services != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Trigger deploy build
        if: steps.changes.outputs.services != ''
        run: |
          id=$(aws codebuild start-build \
            --project-name "${{ vars.CODEBUILD_PROJECT }}" \
            --environment-variables-override \
              name=CHANGED_SERVICES,value="${{ steps.changes.outputs.services }}" \
              name=IMAGE_TAG,value="$GITHUB_SHA" \
            --query 'build.id' --output text)
          # Fire-and-forget: verdict lives on the build itself.
          {
            echo "deploy build started: \`$id\`"
            echo "[build history](https://${{ vars.AWS_REGION }}.console.aws.amazon.com/codesuite/codebuild/projects/${{ vars.CODEBUILD_PROJECT }}/history)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip — no service code changed
        if: steps.changes.outputs.services == ''
        run: echo "push touched no backend/ or frontend/ files — nothing to deploy"
