name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run tests
        working-directory: backend
        run: npx jest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npx vitest run

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cashiery
          POSTGRES_PASSWORD: cashiery-dev-password
          POSTGRES_DB: cashiery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashiery -d cashiery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Same DB_* vars database/db.js reads; scripts/migrate.js maps them
      # to the DATABASE_URL node-pg-migrate expects.
      DB_HOST: localhost
      DB_USER: cashiery
      DB_PASSWORD: cashiery-dev-password
      DB_NAME: cashiery
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Smoke test migrations (up -> down -> up)
        working-directory: backend
        run: |
          npm run migrate:up
          npm run migrate:down
          npm run migrate:up

  frontend-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cashiery
          POSTGRES_PASSWORD: cashiery-dev-password
          POSTGRES_DB: cashiery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashiery -d cashiery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Same DB_* vars database/db.js reads; scripts/migrate.js maps them
      # to the DATABASE_URL node-pg-migrate expects. JWT_SECRET is required
      # by backend/index.js.
      DB_HOST: localhost
      DB_USER: cashiery
      DB_PASSWORD: cashiery-dev-password
      DB_NAME: cashiery
      JWT_SECRET: e2e-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Apply migrations
        working-directory: backend
        run: npm run migrate:up
      - name: Start backend
        working-directory: backend
        run: node index.js &
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:5000/api/products && break; sleep 1; done
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Get Playwright version
        id: playwright-version
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Browsers (~150MB) are cached per @playwright/test version — a hit
      # skips the download; install-deps still runs since system libs
      # aren't cacheable (it's a fast no-op when they're present).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright system dependencies
        working-directory: frontend
        run: npx playwright install-deps chromium
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install chromium
      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

  # Full-stack docker smoke: builds the real images, brings the compose
  # stack up, and curls through the nginx /api proxy — catches broken
  # Dockerfiles, nginx config, entrypoints, and compose wiring that the
  # unit suites can't see. Compose's dev defaults cover every env var.
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build all images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      # The proxied health endpoint is the wait target — one URL proves
      # nginx is up, /api forwards to the backend, the backend booted, and
      # its entrypoint ran migrations against postgres.
      - name: Wait for healthy services
        run: |
          for i in $(seq 1 90); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || true)" = "200" ]; then
              echo "stack healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become healthy"
          docker compose ps
          docker compose logs --tail 60
          exit 1
      - name: Smoke assertions
        run: |
          set -e
          # Static SPA serves with the hardened CSP.
          curl -sfI http://localhost:3000/ | \
            grep -i "content-security-policy:.*connect-src 'self'"

          # /api is proxied same-origin through nginx to the backend.
          curl -sf http://localhost:3000/api/health | grep -q '"status":"OK"'

          # The backend's own published port still answers (dev path).
          curl -sf http://localhost:5001/api/health | grep -q '"status":"OK"'

          # Full auth round-trip through the proxy: the first-ever
          # register is the unauthenticated admin bootstrap, then login
          # returns a signed JWT — JSON through nginx -> backend -> pg.
          curl -sf -X POST http://localhost:3000/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"smoke-admin","password":"smoke-pass-123","role":"admin"}' | \
            grep -q 'User created'
          curl -sf -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"smoke-admin","password":"smoke-pass-123"}' | \
            grep -q '"token"'

          # Postgres must not be published on the host.
          if curl -sf --max-time 3 http://localhost:5432 >/dev/null 2>&1; then
            echo "postgres unexpectedly reachable from the host"
            exit 1
          fi

          echo "all smoke assertions passed"
      - name: Tear down
        if: always()
        run: docker compose down -v

  # Path-filtered deploy trigger: diffs the push range, then hands off to
  # CodeBuild, which clones the repo, builds+pushes each changed service
  # image, and redeploys the EC2 box via SSM (all inside the buildspec).
  # Auth is OIDC — the role (AWS_DEPLOY_ROLE_ARN secret) is created by
  # Terraform and only assumable from this repo's main branch.
  deploy:
    if: github.event_name == 'push'
    needs: [backend-tests, frontend-build, frontend-tests, migrations, frontend-e2e, compose-smoke]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # need HEAD + the push's base commit for the diff

      - name: Detect changed service directories
        id: changes
        run: |
          before="${{ github.event.before }}"
          # All-zero 'before' (first push to a branch) or missing object —
          # deploy everything.
          if [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "services=backend frontend" >> "$GITHUB_OUTPUT"
          else
            svcs=$(git diff --name-only "$before" "$GITHUB_SHA" \
              | cut -d/ -f1 | grep -E '^(backend|frontend)$' | sort -u | tr '\n' ' ' || true)
            echo "services=$svcs" >> "$GITHUB_OUTPUT"
          fi

      # The AWS side only exists once the infrastructure/ Terraform is
      # applied and the 3 repo entries are set — until then, skip instead
      # of failing on missing config (a service-code push is still a
      # green CI run without a deploy target).
      - name: Check deploy configuration
        id: deploycfg
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
          PROJECT: ${{ vars.CODEBUILD_PROJECT }}
        run: |
          if [ -z "$ROLE_ARN" ] || [ -z "$REGION" ] || [ -z "$PROJECT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AWS deploy not configured (needs AWS_DEPLOY_ROLE_ARN secret + AWS_REGION/CODEBUILD_PROJECT vars) — skipping"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.changes.outputs.services != '' && steps.deploycfg.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Trigger deploy build
        if: steps.changes.outputs.services != '' && steps.deploycfg.outputs.configured == 'true'
        run: |
          id=$(aws codebuild start-build \
            --project-name "${{ vars.CODEBUILD_PROJECT }}" \
            --environment-variables-override \
              name=CHANGED_SERVICES,value="${{ steps.changes.outputs.services }}" \
              name=IMAGE_TAG,value="$GITHUB_SHA" \
            --query 'build.id' --output text)
          # Fire-and-forget: verdict lives on the build itself.
          {
            echo "deploy build started: \`$id\`"
            echo "[build history](https://${{ vars.AWS_REGION }}.console.aws.amazon.com/codesuite/codebuild/projects/${{ vars.CODEBUILD_PROJECT }}/history)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip — no service code changed
        if: steps.changes.outputs.services == ''
        run: echo "push touched no backend/ or frontend/ files — nothing to deploy"
