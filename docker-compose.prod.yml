# Cashiery POS — production compose: pulls pre-built images from ECR instead
# of building locally. Used by the EC2 user_data bootstrap; requires the
# ECR_* + IMAGE_TAG vars (written into .env by Terraform's user_data).
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Same layout as docker-compose.yml — Postgres is internal-only, nginx
# proxies /api to the backend, so port 3000 is the only public surface.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    image: ${ECR_REGISTRY}/${ECR_BACKEND_REPO}:${IMAGE_TAG}
    init: true
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      SEED_PRODUCTS: ${SEED_PRODUCTS:-true}
    depends_on:
      - db

  frontend:
    image: ${ECR_REGISTRY}/${ECR_FRONTEND_REPO}:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
