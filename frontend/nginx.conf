# Nginx config for the Cashiery frontend container.
# - Serves the Vite static build (dist/) with SPA fallback (client-side routing).
# - Proxies /api to the backend service. The frontend code calls relative
#   URLs ("/api/...") — in dev they're forwarded by the Vite dev-server
#   proxy in vite.config.js; in this image nginx does the same job, so no
#   code change is needed.
#
# Fully static config — the browser only ever talks to this origin, so the
# CSP connect-src below is a plain 'self'.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Re-resolve the backend name per request: compose can hand the
    # container a new IP on recreate, and an IP cached at startup would
    # 502 until this container restarted. 127.0.0.11 is docker's
    # embedded DNS.
    resolver 127.0.0.11 valid=30s;
    set $backend http://backend:5000;

    # Forward API calls to the Express backend (compose service name "backend").
    # All proxied requests arrive from this container's IP, so the
    # backend's IP rate limiter buckets them together — fine for
    # single-tenant use.
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A generous read timeout — most API calls are instant, but a slow
        # report or a busy postgres shouldn't hit the 60s default.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # NOTE: an add_header inside a `location` replaces ALL inherited
    # server-level add_headers, so the security headers are repeated in
    # every location that sets its own headers.
    location /assets/ {
        # Vite emits content-hashed filenames under /assets — cache forever.
        expires 1y;
        add_header Cache-Control "immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # SPA fallback: unknown paths serve index.html so react-router can handle them.
    location / {
        # Always revalidate the HTML so new deploys take effect immediately.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
