version: 0.2

# Dev deploy buildspec — inlined into the 'cashiery-pos-dev-build' CodeBuild
# project by Terraform (project source is NO_SOURCE; the repo is cloned below).
#
# The GitHub Actions deploy job detects which service dirs changed and starts
# this build with env overrides:
#   GIT_REF           commit to check out and build (the push SHA)
#   IMAGE_TAG         stack tag to publish (dev-<sha>)
#   LATEST_TAG        mutable env tag moved to the new images (dev-latest) —
#                     the promote pipeline reads this, never guesses a sha
#   CHANGED_SERVICES  space-separated service dirs ("backend", "frontend", both)
# Project env provides: REPO_URL, ECR_REGISTRY, ECR_BACKEND_REPO,
# ECR_FRONTEND_REPO, INSTANCE_ID.
#
# Rendered through Terraform templatefile() — write $VAR, never $${VAR}.

phases:
  pre_build:
    commands:
      - git clone --quiet "$REPO_URL" src
      - cd src && git checkout --quiet "$GIT_REF"
      - echo "deploying [$CHANGED_SERVICES] at $GIT_REF -> $IMAGE_TAG"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

  build:
    commands:
      - |
        cd src   # phases run separate shells — pre_build's cd doesn't persist
        for svc in backend frontend; do
          case "$svc" in
            backend)  repo="$ECR_BACKEND_REPO" ;;
            frontend) repo="$ECR_FRONTEND_REPO" ;;
          esac

          changed=0
          for c in $CHANGED_SERVICES; do [ "$c" = "$svc" ] && changed=1; done

          # The box pulls BOTH repos at $IMAGE_TAG, so unchanged services
          # still need the new stack tag — copy the verified manifest
          # forward instead of rebuilding (or the pull fails on a
          # single-service push).
          if [ "$changed" = "0" ]; then
            manifest=$(aws ecr batch-get-image --repository-name "$repo" \
              --image-ids "imageTag=$LATEST_TAG" \
              --query 'images[0].imageManifest' --output text 2>/dev/null || true)
            if [ -n "$manifest" ] && [ "$manifest" != "None" ]; then
              echo "=== reusing $svc: $LATEST_TAG -> $IMAGE_TAG"
              aws ecr put-image --repository-name "$repo" \
                --image-tag "$IMAGE_TAG" --image-manifest "$manifest" > /dev/null
              continue
            fi
            echo "=== $svc unchanged but no $LATEST_TAG image to reuse — building"
          fi

          echo "=== building $svc -> $ECR_REGISTRY/$repo:$IMAGE_TAG"
          docker build -t "$ECR_REGISTRY/$repo:$IMAGE_TAG" "$svc"
          docker push "$ECR_REGISTRY/$repo:$IMAGE_TAG"

          # Move the mutable env tag — manifest retag, no re-push.
          manifest=$(aws ecr batch-get-image --repository-name "$repo" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'images[0].imageManifest' --output text)
          aws ecr put-image --repository-name "$repo" \
            --image-tag "$LATEST_TAG" --image-manifest "$manifest" > /dev/null
        done
        touch /tmp/deployed   # flag for post_build (env vars don't cross phases)

  post_build:
    commands:
      - |
        if [ ! -f /tmp/deployed ]; then
          echo "build phase failed or ran nothing — skipping redeploy"
          exit 0
        fi
        ${ssm_redeploy}
